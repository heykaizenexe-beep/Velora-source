<!doctype html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=4, viewport-fit=cover"><title>Velora Notes</title>
<style>
@font-face{font-family:VeloraPixel;src:url('https://velora.notes.local/font/pixel.ttf') format('truetype');font-display:swap}
:root{--bg:#0d171c;--paper:#14242b;--text:#e9f9ec;--muted:#97aaab;--accent:#78e2a4;--border:#44635e;--stroke:#c3e7e0}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:system-ui,'Segoe UI',sans-serif}
body{display:flex;flex-direction:column;height:100%;overflow:hidden}
button,select,input{font:inherit;color:inherit}button{cursor:pointer;touch-action:manipulation}
#chrome{flex:none;background:var(--bg);z-index:4;border-bottom:1px solid var(--border)}
header{display:flex;align-items:center;gap:8px;padding:8px 10px 6px}
#back{flex:none;width:40px;height:40px;border:1px solid var(--border);border-radius:5px;background:var(--paper);font-size:22px}
#heading{background:transparent;border:0;outline:none;min-width:0;flex:1;padding:6px 2px;font-size:18px;font-weight:650;overflow:hidden;text-overflow:ellipsis}
#done{border:0;border-radius:5px;background:var(--accent);color:var(--bg);font-weight:700;min-width:40px;height:40px;padding:0 12px}
#toolbar{position:relative;display:flex;align-items:center;gap:5px;padding:4px 12px 9px;overflow:visible}
#toolbar button,#toolbar select,#moreTools summary{flex:0 0 auto;min-width:39px;height:38px;background:var(--paper);border:1px solid var(--border);border-radius:5px;font-size:14px;padding:0 7px}
#toolbar>button{flex:1;min-width:0}#toolbar>button[data-tool="photo"]{flex:1.35}
#moreTools{flex:0 0 auto}#moreTools summary{display:flex;align-items:center;justify-content:center;list-style:none;cursor:pointer;padding:0 10px;min-width:42px}#moreTools summary::-webkit-details-marker{display:none}
#advancedTools{position:absolute;right:12px;left:12px;top:calc(100% + 1px);padding:10px;background:var(--paper);border:1px solid var(--border);border-radius:6px;box-shadow:0 10px 22px #0005;z-index:8}
#toolTabs{display:flex;gap:6px;margin-bottom:8px}#toolTabs button{flex:1;background:var(--bg);font-size:12px}
#textTools,#drawTools{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}#textTools button,#drawTools button{width:100%;min-width:0}
#advancedTools[data-panel="text"] #drawTools,#advancedTools[data-panel="draw"] #textTools{display:none}
#toolTabs button[aria-selected="true"]{border-color:var(--accent);color:var(--accent)}
#toolbar button.active{background:var(--accent);color:#10221c}
#toolbar .colorControl{width:100%;min-width:0;height:38px;padding:3px;background:var(--bg);border:1px solid var(--border);border-radius:5px}
#toolbar button:focus-visible{outline:2px solid var(--accent)}
#toolbar button[data-tool="underline"]{text-decoration:underline}#toolbar button[data-tool="italic"]{font-style:italic}
#toolbar button[data-tool="bold"]{font-weight:900}
#pageWrap{padding:10px 12px 18px;flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain}
#page{position:relative;width:100%;max-width:880px;margin:auto;border:1px solid var(--border);border-radius:5px;background:var(--paper);min-height:100%}
#editor{position:relative;outline:0;min-height:55vh;padding:18px 16px 40px;overflow-wrap:anywhere;white-space:normal;color:var(--text);font-size:17px;line-height:1.6;caret-color:var(--accent)}
#editor:empty:before{content:attr(data-placeholder);pointer-events:none;opacity:.62}
#editor h1{font-size:1.5em;line-height:1.35}#editor h2{font-size:1.23em}#editor p{margin:.5em 0}
#editor blockquote{border-left:3px solid var(--accent);padding-left:13px;margin-left:3px;opacity:.9}
#editor img{max-width:100%;height:auto;display:block;border-radius:8px;object-fit:contain;margin:10px auto}
#editor figure{padding:8px;border:1px solid var(--border);border-radius:8px;margin:12px 0}#editor figcaption{text-align:center;color:var(--muted);font-size:13px}
#inkLayer{position:absolute;left:0;top:0;z-index:2;overflow:visible;pointer-events:none;width:100%;height:100%;touch-action:none}
#inkLayer.drawing{pointer-events:auto;cursor:crosshair}#inkLayer path{stroke-linecap:round;stroke-linejoin:round;fill:none}
#bottom{display:flex;flex:none;align-items:center;justify-content:space-between;padding:7px 12px calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg);color:var(--muted);font-size:12px;gap:8px;border-top:1px solid var(--border)}
#folder{flex:1;min-width:0;max-width:62%;color:var(--text);background:var(--bg);border:1px solid var(--border);border-radius:5px;padding:6px}
#status{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#penOptions{display:contents}#penOptions select,#penOptions input{width:100%;height:38px;min-width:0;background:var(--bg);border:1px solid var(--border);padding:3px}
#sketchPanel{position:fixed;z-index:10;inset:0;background:var(--bg);display:none;flex-direction:column;padding:30px 12px 14px}
#sketchPanel.open{display:flex}#sketchHead{display:flex;align-items:center;justify-content:space-between;gap:6px;flex-wrap:wrap;padding:8px 0}
#sketchHead button{border:1px solid var(--border);background:var(--paper);color:var(--text);border-radius:8px;min-height:42px;padding:0 11px}
#sketch{flex:1;min-height:160px;width:100%;background:#fffef6;border-radius:9px;touch-action:none;border:2px solid var(--border)}
#sketchHead #sketchInsert{background:var(--accent);color:#10221c;font-weight:700}
@media(min-width:700px){header{padding:28px 32px 8px}#toolbar{padding:5px 32px 10px;max-width:880px;margin:auto}#advancedTools{left:auto;width:400px;right:32px}#pageWrap{padding:16px 32px 20px}#editor{font-size:19px;padding:26px 32px 60px}#bottom{padding:8px 30px 15px}}
/* Cartoteka-only dot paper: the writing sheet itself stays solid. */
.archive-theme body,.archive-theme #chrome,.archive-theme #pageWrap,.archive-theme #bottom{
 background-color:var(--bg);
 background-image:radial-gradient(circle,rgba(113,104,94,.34) 1px,transparent 1.3px);
 background-size:20px 20px;
 background-position:10px 10px;
}
.archive-theme #page{background:var(--paper)}
.pixel-theme body{font-family:VeloraPixel,monospace;letter-spacing:.015em}
.pixel-theme header,.pixel-theme #toolbar,.pixel-theme #bottom{text-transform:uppercase}
.pixel-theme #heading{font-size:16px;font-weight:400}.pixel-theme #editor{font-size:16px;line-height:1.7;letter-spacing:0}
.pixel-theme #page,.pixel-theme #back,.pixel-theme #done,.pixel-theme #toolbar button,.pixel-theme #toolbar summary,.pixel-theme #advancedTools,.pixel-theme #folder{border-radius:2px}
.pixel-theme #page{box-shadow:inset 0 0 0 1px var(--border)}
html,body{-webkit-text-size-adjust:100%;max-width:100%;overflow-x:hidden}
#bottom #status{min-width:0;flex:1;text-align:right}#toolbar button{max-width:100%;overflow:hidden}
.pixel-theme #drawTools button{font-size:10px;padding:0 2px}
#heading{width:0}#done{width:44px;padding:0}#editor{min-height:200px}
@media(max-height:500px){header{padding-top:4px}#toolbar{padding-bottom:4px}#advancedTools{padding:5px}#toolbar button,#toolbar select,#moreTools summary{height:30px}#textTools,#drawTools{gap:3px}#toolTabs{margin-bottom:4px}}

.pixel-theme body{background:var(--bg)}
.pixel-theme #chrome{margin:4px 6px 0;border:1px solid var(--border);border-radius:2px;background:var(--paper)}
.pixel-theme #chrome::before{content:"VELORA / ЗАМЕТКИ";display:block;padding:6px 10px 4px;color:var(--accent);font-size:10px;letter-spacing:.1em;border-bottom:1px solid var(--border)}
.pixel-theme header{padding:6px;gap:6px}.pixel-theme #heading{font-size:16px;color:var(--text)}
.pixel-theme #back,.pixel-theme #done{width:36px;min-width:36px;height:36px;border:1px solid var(--border);background:var(--bg);color:var(--accent);font-weight:400}
.pixel-theme #toolbar{padding:0 6px 6px;gap:4px}.pixel-theme #toolbar>button,.pixel-theme #moreTools summary{height:34px;min-width:0;font-size:13px;background:var(--bg);border-radius:1px}
.pixel-theme #pageWrap{padding:8px 6px 10px}.pixel-theme #page{border-radius:1px;background:var(--paper);box-shadow:none;border:1px solid var(--border)}
.pixel-theme #editor{padding:16px 12px 40px;font-size:16px;line-height:1.75}
.pixel-theme #editor:empty:before{color:var(--muted);opacity:.7}
.pixel-theme #editor img,.pixel-theme #editor figure{border-radius:1px}
.pixel-theme #advancedTools{border-radius:1px;border-color:var(--accent);background:var(--paper);box-shadow:0 5px 0 #0006}
.pixel-theme #advancedTools::before{content:"ИНСТРУМЕНТЫ";display:block;color:var(--accent);font-size:10px;margin-bottom:8px;letter-spacing:.08em}
.pixel-theme #toolTabs button{font-size:12px}.pixel-theme #toolbar button.active{background:var(--accent);color:var(--bg)}
.pixel-theme #bottom{margin:0 6px 4px;border:1px solid var(--border);padding:5px 7px;color:var(--muted);font-size:10px;min-height:36px}
.pixel-theme #folder{border:0;border-right:1px solid var(--border);border-radius:0;background:var(--bg);font-size:11px}
.pixel-theme #status::before{content:"▪ ";color:var(--accent)}
@media(max-height:500px){.pixel-theme #chrome::before{display:none}.pixel-theme #editor{padding-top:10px}.pixel-theme #bottom{min-height:28px}}
</style></head><body>
<div id="chrome"><header><button id="back" aria-label="Назад">&#8249;</button><input id="heading" maxlength="500" placeholder="Заголовок" aria-label="Заголовок заметки"><button id="done">OK</button></header>
<nav id="toolbar" aria-label="Инструменты заметки">
<button data-tool="bold" title="Жирный"><b>Ж</b></button><button data-tool="italic" title="Курсив"><i>К</i></button><button data-tool="underline" title="Подчёркнутый"><u>Ч</u></button><button data-tool="photo" title="Добавить фото">Фото</button>
<details id="moreTools"><summary aria-label="Другие инструменты">•••</summary><div id="advancedTools" data-panel="text"><div id="toolTabs"><button type="button" data-panel-target="text" aria-selected="true">Текст</button><button type="button" data-panel-target="draw" aria-selected="false">Рисунок</button></div>
<div id="textTools"><button data-tool="strike" title="Зачёркнутый"><s>S</s></button><button data-tool="h1" title="Заголовок">H1</button><button data-tool="h2" title="Подзаголовок">H2</button><button data-tool="ul" title="Список">• ≡</button><button data-tool="ol" title="Нумерация">1.≡</button><button data-tool="quote" title="Цитата">❞</button><button data-tool="check" title="Чек-лист">☐</button><button data-tool="color" title="Цвет текста">A̲</button><input class="colorControl" type="color" id="textColor" value="#d77d23" title="Цвет текста" aria-label="Цвет текста"><button data-tool="highlight" title="Выделение">▨</button><input class="colorControl" type="color" id="highlightColor" value="#e8d258" title="Цвет выделения" aria-label="Цвет выделения"><button data-tool="undo" title="Отменить">↶</button><button data-tool="redo" title="Повторить">↷</button></div>
<div id="drawTools"><button data-tool="pen" title="Ручка">Ручка</button><button data-tool="marker" title="Маркер">Маркер</button><button data-tool="erase" title="Ластик">Стереть</button><button data-tool="sketch" title="Новый рисунок">Эскиз</button><button data-tool="inkUndo" title="Отменить штрих">↶</button><button data-tool="inkRedo" title="Повторить штрих">↷</button><div id="penOptions"><input type="color" id="inkColor" value="#ffad55" aria-label="Цвет ручки"><select id="penSize" aria-label="Толщина линии"><option value="2">2 px</option><option value="4" selected>4 px</option><option value="7">7 px</option><option value="12">12 px</option></select></div></div></div></details>
</nav></div>
<main id="pageWrap"><section id="page"><div id="editor" contenteditable="true" spellcheck="true" data-placeholder="Напиши свою историю…"></div><svg xmlns="http://www.w3.org/2000/svg" id="inkLayer" aria-label="Handwriting layer"></svg></section></main>
<footer id="bottom"><select id="folder" aria-label="Folder"><option value="-1">&#1041;&#1077;&#1079; &#1087;&#1072;&#1087;&#1082;&#1080;</option></select><span id="status">&#1047;&#1072;&#1075;&#1088;&#1091;&#1079;&#1082;&#1072;...</span></footer>
<div id="sketchPanel"><div id="sketchHead"><button id="sketchCancel">&#1054;&#1090;&#1084;&#1077;&#1085;&#1072;</button><button id="sketchUndo">&#8630;</button><button id="sketchClear">&#1057;&#1090;&#1077;&#1088;&#1077;&#1090;&#1100;</button><button id="sketchInsert">&#1042;&#1089;&#1090;&#1072;&#1074;&#1080;&#1090;&#1100;</button></div><canvas id="sketch"></canvas></div>
<script>
(function(){'use strict';
const $=s=>document.getElementById(s),editor=$('editor'),page=$('page'),ink=$('inkLayer');
let loaded=false,dirty=false,saveTimer=null,inkMode='off',strokes=[],undone=[],activeStroke=null,lastRange=null,inkRaf=0;
let drawing=false,sketchStrokes=[],sketchUndone=[],sketchActive=null;
function status(s){$('status').textContent=s;}
function onChange(){if(!loaded)return;dirty=true;status('Изменено');clearTimeout(saveTimer);saveTimer=setTimeout(()=>veloraFlush(false),900);resizeInk();}
function savedSelection(){const sel=getSelection();if(sel&&sel.rangeCount&&editor.contains(sel.anchorNode)){lastRange=sel.getRangeAt(0).cloneRange();}}
function restoreSelection(){editor.focus();if(lastRange){const s=getSelection();s.removeAllRanges();try{s.addRange(lastRange);}catch(e){lastRange=null;}}}
document.addEventListener('selectionchange',savedSelection);
function format(cmd,value){restoreSelection();document.execCommand(cmd,false,value||null);savedSelection();onChange();}
function insertHTML(html){restoreSelection();const selection=getSelection();if(selection&&selection.rangeCount){const range=selection.getRangeAt(0);range.collapse(false);selection.removeAllRanges();selection.addRange(range);}document.execCommand('insertHTML',false,html);savedSelection();onChange();}
function tool(name){
 if(name==='photo'){if(window.VeloraNative)VeloraNative.pickPhoto();return;}
 if(name==='pen'||name==='marker'||name==='erase'){inkMode=inkMode===name?'off':name;ink.classList.toggle('drawing',inkMode!=='off');
 document.querySelectorAll('#toolbar button').forEach(b=>b.classList.toggle('active',b.dataset.tool===inkMode));resizeInk();return;}
 if(name==='inkUndo'){if(strokes.length){undone.push(strokes.pop());renderInk();onChange();}return;}
 if(name==='inkRedo'){if(undone.length){strokes.push(undone.pop());renderInk();onChange();}return;}
 if(name==='sketch'){openSketch();return;}
 if(name==='bold'||name==='italic'||name==='underline')return format(name);
 if(name==='strike')return format('strikeThrough');
 if(name==='h1'||name==='h2')return format('formatBlock',name);
 if(name==='ul')return format('insertUnorderedList');
 if(name==='ol')return format('insertOrderedList');
 if(name==='quote')return format('formatBlock','blockquote');
 if(name==='check')return insertHTML('<p>\u2610&nbsp;</p>');
 if(name==='color')return format('foreColor',$('textColor').value);
 if(name==='highlight')return format('hiliteColor',$('highlightColor').value);
 if(name==='undo'||name==='redo')return format(name);
}
document.querySelectorAll('#toolbar button[data-tool]').forEach(b=>b.addEventListener('click',()=>{tool(b.dataset.tool);$('moreTools').removeAttribute('open');}));
document.querySelectorAll('[data-panel-target]').forEach(b=>b.addEventListener('click',()=>{
 $('advancedTools').dataset.panel=b.dataset.panelTarget;
 document.querySelectorAll('[data-panel-target]').forEach(tab=>tab.setAttribute('aria-selected',String(tab===b)));
}));
$('pageWrap').addEventListener('pointerdown',()=>$('moreTools').removeAttribute('open'));
$('heading').addEventListener('input',onChange);$('folder').addEventListener('change',onChange);editor.addEventListener('input',onChange);
editor.addEventListener('paste',ev=>{
 const data=ev.clipboardData;if(!data)return;
 const text=data.getData('text/plain');if(!text)return;
 ev.preventDefault();insertHTML(text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>'));
});
function penWidth(){return Math.max(1,Math.min(32,Number($('penSize').value)||4));}
function localPoint(e){const r=page.getBoundingClientRect();return [Math.max(0,Math.min(8000,+(e.clientX-r.left).toFixed(1))),Math.max(0,Math.min(200000,+(e.clientY-r.top).toFixed(1)))];}
function resizeInk(){
 const w=page.clientWidth,h=Math.max(page.clientHeight,editor.scrollHeight);ink.setAttribute('width',w);ink.setAttribute('height',h);
 ink.style.width=w+'px';ink.style.height=h+'px';
}
function dPath(points){if(!points||!points.length)return '';return 'M'+points.map((p,i)=>(i?'L':'')+p[0]+','+p[1]).join(' ');}
function renderInk(){resizeInk();while(ink.firstChild)ink.removeChild(ink.firstChild);
 strokes.forEach(s=>{const p=document.createElementNS('http://www.w3.org/2000/svg','path');p.setAttribute('d',dPath(s.points));p.setAttribute('stroke',s.color);p.setAttribute('stroke-width',s.width);p.setAttribute('opacity',s.kind==='marker'?'0.38':'1');ink.appendChild(p);});
 if(activeStroke){const p=document.createElementNS('http://www.w3.org/2000/svg','path');p.setAttribute('d',dPath(activeStroke.points));p.setAttribute('stroke',activeStroke.color);p.setAttribute('stroke-width',activeStroke.width);p.setAttribute('opacity',activeStroke.kind==='marker'?'0.38':'1');ink.appendChild(p);}
}
function distToSegment(pt,a,b){let dx=b[0]-a[0],dy=b[1]-a[1],len=dx*dx+dy*dy;let t=len?Math.max(0,Math.min(1,((pt[0]-a[0])*dx+(pt[1]-a[1])*dy)/len)):0;return Math.hypot(pt[0]-a[0]-t*dx,pt[1]-a[1]-t*dy);}
function eraseAt(pt){for(let i=strokes.length-1;i>=0;i--){const s=strokes[i];for(let j=1;j<s.points.length;j++){if(distToSegment(pt,s.points[j-1],s.points[j])<Math.max(11,s.width)){strokes.splice(i,1);undone=[];renderInk();onChange();return;}}}}
ink.addEventListener('pointerdown',e=>{if(inkMode==='off'||!loaded)return;e.preventDefault();ink.setPointerCapture(e.pointerId);const pt=localPoint(e);
 if(inkMode==='erase'){eraseAt(pt);return;}
 activeStroke={kind:inkMode==='marker'?'marker':'pen',color:$('inkColor').value,width:Math.min(32,penWidth()*(inkMode==='marker'?3:1)),points:[pt,pt]};renderInk();});
ink.addEventListener('pointermove',e=>{if(!activeStroke)return;e.preventDefault();const pt=localPoint(e),points=activeStroke.points;
 if(points.length<5000&&Math.hypot(pt[0]-points[points.length-1][0],pt[1]-points[points.length-1][1])>=1){points.push(pt);if(!inkRaf)inkRaf=requestAnimationFrame(()=>{inkRaf=0;renderInk();});}});
function finishInk(e){if(!activeStroke)return;const s=activeStroke;activeStroke=null;strokes.push(s);undone=[];renderInk();onChange();}
ink.addEventListener('pointerup',finishInk);ink.addEventListener('pointercancel',finishInk);
// This pad inserts a portable image into the rich-text flow; inline ink stays editable as paths.
const canvas=$('sketch'),ctx=canvas.getContext('2d');
function openSketch(){drawing=true;sketchStrokes=[];sketchUndone=[];$('sketchPanel').classList.add('open');requestAnimationFrame(()=>{canvas.width=Math.max(320,Math.floor(canvas.clientWidth*devicePixelRatio));canvas.height=Math.max(320,Math.floor(canvas.clientHeight*devicePixelRatio));renderSketch();});}
function renderSketch(){ctx.fillStyle='#fffef6';ctx.fillRect(0,0,canvas.width,canvas.height);const draw=s=>{const pts=s.points;if(!pts.length)return;ctx.strokeStyle=s.color;ctx.lineWidth=s.width*devicePixelRatio;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();pts.forEach((p,i)=>{if(i===0)ctx.moveTo(p[0],p[1]);else ctx.lineTo(p[0],p[1]);});ctx.stroke();};sketchStrokes.forEach(draw);if(sketchActive)draw(sketchActive);}
function sketchPt(e){const r=canvas.getBoundingClientRect(),sx=canvas.width/r.width,sy=canvas.height/r.height;return [(e.clientX-r.left)*sx,(e.clientY-r.top)*sy];}
canvas.addEventListener('pointerdown',e=>{e.preventDefault();canvas.setPointerCapture(e.pointerId);sketchActive={color:$('inkColor').value,width:penWidth(),points:[sketchPt(e)]};renderSketch();});
canvas.addEventListener('pointermove',e=>{if(!sketchActive)return;e.preventDefault();sketchActive.points.push(sketchPt(e));renderSketch();});
function sketchEnd(){if(sketchActive){sketchStrokes.push(sketchActive);sketchActive=null;renderSketch();}}
canvas.addEventListener('pointerup',sketchEnd);canvas.addEventListener('pointercancel',sketchEnd);
$('sketchCancel').onclick=()=>{$('sketchPanel').classList.remove('open');drawing=false;};
$('sketchUndo').onclick=()=>{if(sketchStrokes.length){sketchUndone.push(sketchStrokes.pop());renderSketch();}};
$('sketchClear').onclick=()=>{sketchStrokes=[];sketchUndone=[];renderSketch();};
$('sketchInsert').onclick=()=>{sketchEnd();if(window.VeloraNative){VeloraNative.saveDrawing(canvas.toDataURL('image/png'));$('sketchPanel').classList.remove('open');drawing=false;status('Saving drawing...');}};
window.veloraInsertMedia=function(url){if(typeof url!=='string'||!/^https:\/\/velora\.notes\.local\/media\/[0-9a-f]{32}\.(jpg|png)$/.test(url))return;
 insertHTML('<figure><img src="'+url+'" alt="Фото или рисунок"><figcaption> </figcaption></figure><p><br></p>');status('Изображение добавлено');};
window.veloraLoad=function(data){if(loaded||!data)return;
 $('heading').value=data.title||'';editor.innerHTML=data.html||'';
 strokes=Array.isArray(data.ink)?data.ink:[];undone=[];
 const box=$('folder');(data.folders||[]).forEach(f=>{const option=document.createElement('option');option.value=f.id;option.textContent=f.name;box.appendChild(option);});
 box.value=data.folder>0?String(data.folder):'-1';loaded=true;dirty=false;renderInk();status('Готово');};
window.veloraPalette=function(colors){if(!colors)return;const s=document.documentElement.style;
 const names={background:'bg',surface:'paper',text:'text',muted:'muted',accent:'accent',border:'border'};
 Object.keys(names).forEach(k=>{if(colors[k])s.setProperty('--'+names[k],colors[k]);});
 document.documentElement.classList.toggle('pixel-theme',!!colors.pixel);
  document.documentElement.classList.toggle('archive-theme',!!colors.archive);
};
window.veloraFlush=function(close){if(!loaded)return;
 clearTimeout(saveTimer);saveTimer=null;if(!dirty&&!close)return;
 if(!window.VeloraNative)return;
 const html=editor.innerHTML,plain=editor.innerText||'',title=$('heading').value,folder=Number($('folder').value)||-1;
 status('Сохранение...');VeloraNative.save(title,html,JSON.stringify(strokes),plain,folder,!!close);dirty=false;};
window.veloraSaved=function(id){status('Сохранено');};
window.veloraError=function(error){dirty=true;status(error||'Ошибка сохранения');};
window.veloraClose=function(){if(drawing){$('sketchCancel').click();return;}veloraFlush(true);};
