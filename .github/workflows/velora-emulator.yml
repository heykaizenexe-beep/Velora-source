name: Velora Android emulator smoke

on:
  push:
    branches:
      - fix/edge-drag-preview-0.9.140
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-smoke:
    name: Build, JVM regressions and real emulator edge-drags
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Checkout Velora
        uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build reconstructed Android APK
        run: python3 rebuild.py --compile-home

      - name: Run behavioral JVM regression tests
        run: python3 tools/run_tests.py

      - name: Install screenshot comparison dependency
        run: python3 -m pip install pillow==11.3.0

      - name: Enable KVM for emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Open book and drag right/left edges on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect
          script: python3 tools/android_emulator_smoke.py

      - name: Upload screenshots and logcat (even on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: velora-android-emulator-evidence
          path: |
            build-output/emulator-evidence/
            build-output/tests/summary.json
          if-no-files-found: warn
          retention-days: 14
