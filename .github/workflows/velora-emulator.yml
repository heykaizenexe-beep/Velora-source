name: Velora Android emulator smoke

on:
  push:
    branches:
      - fix/edge-drag-preview-0.9.140
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-smoke:
    name: Build, JVM regressions and real emulator edge-drags
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Checkout Velora
        uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build reconstructed Android APK
        run: python3 rebuild.py --compile-home

      # The legacy tools/run_tests.py compiles ALL test-only android.* stubs
      # together and collides with the real android.jar. Exercise pure-Java
      # book geometry/gesture/cache tests separately instead.
      - name: Run pure JVM book gesture and curl regressions
        shell: bash
        run: |
          mkdir -p build-output/gesture-tests
          javac -encoding UTF-8 -d build-output/gesture-tests \
            native-source/app/velora/reader/crtui/PageTurnGesture.java \
            native-source/app/velora/reader/crtui/PageCurlGeometry.java \
            native-source/app/velora/reader/crtui/PageCurlMesh.java \
            native-source/app/velora/reader/crtui/PageTurnSurface.java \
            native-source/app/velora/reader/crtui/PageTurnRelease.java \
            native-source/app/velora/reader/crtui/PageTurnCache.java \
            tests/app/velora/reader/crtui/PageTurnGestureRegressionTest.java \
            tests/app/velora/reader/crtui/PageCurlGeometryRegressionTest.java \
            tests/app/velora/reader/crtui/PageCurlMeshRegressionTest.java \
            tests/app/velora/reader/crtui/PageTurnReleaseRegressionTest.java \
            tests/app/velora/reader/crtui/PageTurnCacheRegressionTest.java
          for test in PageTurnGestureRegressionTest PageCurlGeometryRegressionTest PageCurlMeshRegressionTest PageTurnReleaseRegressionTest PageTurnCacheRegressionTest; do
            java -ea -cp build-output/gesture-tests app.velora.reader.crtui."$test"
          done

      - name: Install screenshot comparison dependency
        run: python3 -m pip install pillow==11.3.0

      - name: Enable KVM for emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Open book and drag right/left edges on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect
          script: bash -c 'python3 tools/android_emulator_startup.py && python3 tools/android_emulator_cartoteka_smoke.py && python3 tools/android_emulator_smoke.py'

      - name: Upload screenshots and logcat (even on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: velora-android-emulator-evidence
          path: |
            build-output/emulator-evidence/
            build-output/tests/summary.json
          if-no-files-found: warn
          retention-days: 14
