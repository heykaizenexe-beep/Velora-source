name: Inspect reading appearance options
on:
  push:
    paths:
      - .github/workflows/reader-theme-inspect.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Locate theme selection and nearby code
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path("decoded/smali_classes5/app/velora/reader/feature/reader/readium")
          for p in [root/"ReadiumReaderUiKt.smali",root/"ComposableSingletons$ReadiumReaderUiKt.smali"]:
            lines=p.read_text().splitlines()
            terms=("Theme;->", "SEPIA", "Сепия", "Тёмная", "Темная", "readium_settings_theme",
                   "PageTheme", "themeOptions", "Theme.valueOf", "Theme;->values", "ЧТЕНИЯ",
                   "Тема страницы", "Дневной", "Ночной", "Темы", "Режим чтения")
            hits=[i for i,line in enumerate(lines) if any(t in line for t in terms)]
            print("FILE",p,"LINES",len(lines),"HITS",len(hits))
            for i in hits[:90]:
              start=max(0,i-16); end=min(len(lines),i+22)
              print("LOCATION",i+1,"\\n"+"\\n".join(f"{j+1}: {lines[j]}" for j in range(start,end)))
          PY
