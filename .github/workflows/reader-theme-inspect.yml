name: Inspect reading appearance options
on:
  push:
    paths:
      - .github/workflows/reader-theme-inspect.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Locate theme selection and nearby code
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("decoded/smali_classes5/app/velora/reader/feature/reader/readium/ReadiumReaderUiKt.smali")
          ls=p.read_text().splitlines()
          for a,b in ((38558,38980),(34770,34930)):
            print("RANGE",a,b)
            print("\\n".join(f"{i+1}: {ls[i]}" for i in range(a-1,b) ))
          for i,l in enumerate(ls):
            if ".method" in l and ("ReadiumSettingsOverlay$lambda$0$27$1$8$0$0$0" in l or "ReadiumSettingsOverlay$lambda$0$27$1$8" in l):
              print("CALLBACK",i+1)
              print("\\n".join(f"{k+1}: {ls[k]}" for k in range(i,min(i+70,len(ls)))))
          PY
