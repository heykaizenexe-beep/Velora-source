name: Apply reading appearance swatches
on:
  push:
    paths: [tools/patch_reader_color_swatches.py]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Color the four reader themes
        run: python3 tools/patch_reader_color_swatches.py
      - name: Commit visible theme swatches to main
        run: |
          if git diff --quiet -- decoded/smali_classes5/app/velora/reader/feature/reader/readium/ReadiumReaderUiKt.smali; then
            echo "Already patched"
          else
            git config user.name "Velora GitHub Actions"
            git config user.email "actions@users.noreply.github.com"
            git add decoded/smali_classes5/app/velora/reader/feature/reader/readium/ReadiumReaderUiKt.smali
            git commit -m "Show exact page background and text colors on all four reader theme buttons"
            git push origin HEAD:main
          fi
