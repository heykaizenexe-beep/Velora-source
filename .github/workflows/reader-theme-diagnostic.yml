name: Diagnose reader newspaper theme crash
on:
  push:
    paths:
      - tools/android_reader_theme_diagnostic.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 rebuild.py --compile-home
      - run: python3 -m pip install pillow==11.3.0
      - name: Enable hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect
          script: python3 tools/android_reader_theme_diagnostic.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reader-newspaper-crash-diagnostics
          path: build-output/emulator-evidence/
          retention-days: 7
