name: Velora main APK build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and package Velora
        run: python3 rebuild.py --compile-home
      - name: Check carousel and newspaper design regression
        run: python3 tools/check_editorial.py
      - name: Check Cartoteka journal, paper and viewport contracts
        run: python3 tools/check_cartoteka_160.py
      - name: Check journal and editorial UI contracts
        run: python3 tools/check_journal_design.py
      - name: Check Gradle migration boundary
        run: python3 tools/check_modernization.py
      - name: Check editorial reading invariants
        run: python3 tools/check_velora_158.py
      - name: Check Fables-style cover deck and theme isolation
        run: python3 tools/check_velora_159.py
      - name: Test pure-Java Tinder-style swipe math
        run: |
          mkdir -p build-output/editorial-tests
          javac -encoding UTF-8 -d build-output/editorial-tests \
            native-source/app/velora/reader/crtui/EditorialSwipeMotion.java \
            tests/app/velora/reader/crtui/EditorialSwipeMotionRegressionTest.java
          java -ea -cp build-output/editorial-tests app.velora.reader.crtui.EditorialSwipeMotionRegressionTest
      - name: Check independent reading themes
        run: python3 tools/check_reader_palettes.py
      - name: Test EPUB and FB2 footnote extraction and popup placement
        run: |
          mkdir -p build-output/footnote-tests
          java -jar tool-cache/ecj.jar -1.8 -encoding UTF-8 -warn:none -cp tool-cache/jsoup.jar -d build-output/footnote-tests \
            native-source/app/velora/reader/crtui/FootnoteContent.java \
            native-source/app/velora/reader/crtui/FootnotePopupLayout.java \
            tests/app/velora/reader/crtui/FootnoteContentRegressionTest.java \
            tests/app/velora/reader/crtui/FootnotePopupLayoutRegressionTest.java
          java -ea -cp build-output/footnote-tests:tool-cache/jsoup.jar app.velora.reader.crtui.FootnoteContentRegressionTest
          java -ea -cp build-output/footnote-tests:tool-cache/jsoup.jar app.velora.reader.crtui.FootnotePopupLayoutRegressionTest
      - name: Publish build artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Velora-0.9.160-Cartoteka
          path: build-output/Velora-CRT.apk
          retention-days: 14
