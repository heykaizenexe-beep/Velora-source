name: Velora main APK build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and package Velora
        run: python3 rebuild.py --compile-home
      - name: Check carousel and newspaper design regression
        run: python3 tools/check_editorial.py
      - name: Check independent reading themes
        run: python3 tools/check_reader_palettes.py
      - name: Publish build artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Velora-0.9.146-main-APK
          path: build-output/Velora-CRT.apk
          retention-days: 14
