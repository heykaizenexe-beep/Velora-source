name: Compact Readium settings sliders
on:
  push:
    paths: [tools/patch_reader_settings_compact.py]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Replace verbose stacked slider UI with compact accessible rows
        run: python3 tools/patch_reader_settings_compact.py
      - name: Commit smali patch to main
        run: |
          if git diff --quiet -- decoded/smali_classes5/app/velora/reader/feature/reader/readium/ReadiumReaderUiKt.smali; then
            echo "Already patched"
          else
            git config user.name "Velora GitHub Actions"
            git config user.email "actions@users.noreply.github.com"
            git add decoded/smali_classes5/app/velora/reader/feature/reader/readium/ReadiumReaderUiKt.smali
            git commit -m "Use compact rows for reader font and spacing settings"
            git push origin HEAD:main
          fi
